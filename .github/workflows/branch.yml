name: branch

on:
  push:
    branches-ignore: [main]
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: wtnb75/actions/golang@v1
    - uses: wtnb75/actions/gotest@v1

  docker:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: true
    - name: goreleaser build snapshot
      uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
      with:
        distribution: goreleaser
        version: '2.17.0'
        args: build --snapshot --clean
      env:
        GITHUB_TOKEN: ${{ github.token }}
    - name: Prepare binaries for Docker
      run: |
        mkdir -p linux/amd64 linux/arm64
        cp dist/mcprt_linux_amd64_v1/mcprt linux/amd64/mcprt
        cp dist/mcprt_linux_arm64_v8.0/mcprt linux/arm64/mcprt
    - uses: wtnb75/actions/docker@v1
      with:
        push: 'true'
        context: .
        username: ${{ github.actor }}
        password: ${{ github.token }}
