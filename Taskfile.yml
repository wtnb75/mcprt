# yaml-language-server: $schema=https://taskfile.dev/schema.json

version: '3'

tasks:
  default:
    desc: list
    cmds:
      - task -l --sort=alphanumeric

  build:
    desc: build binary
    cmds:
      - go build -o bin/mcprt ./cmd/mcprt

  run:
    desc: run
    cmds:
      - go run ./cmd/mcprt {{ .CLI_ARGS }}

  test:
    desc: run test
    cmds:
      - go test -cover ./...

  lint:
    desc: run lint
    cmds:
      - gofmt -l .
      - go vet ./...
      - golangci-lint run ./...

  fmt:
    desc: run fmt
    cmds:
      - gofmt -w .
      - go fix ./...

  schema:
    desc: regenerate config.schema.json from internal/config.Config
    cmds:
      - go run ./cmd/mcprt schema --force config.schema.json
